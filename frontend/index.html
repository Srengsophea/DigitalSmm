<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigitalSMM — Premier Automated Social Media Marketing Platform</title>
    <meta name="description" content="Access over 7,500+ direct provider services with automated instant delivery, AES-256 encrypted security, and wholesale pricing on DigitalSMM." />
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Identity Services (GIS) for Google Sign-In & One Tap -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Theme initialization script to prevent FOUC -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('digitalsmm_theme') || localStorage.getItem('theme');
          if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            t = 'dark';
          }
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
